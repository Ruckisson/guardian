id: IOS-L2-003
title: Trunk ports must not negotiate with DTP
severity: medium

scope:
  path: "^interface "
  has_child: "^switchport mode trunk$"

check:
  must_exist: "^switchport nonegotiate$"

rationale: >
  A static trunk still sends DTP frames unless negotiation is turned off.
  That tells anyone on the link it is a trunk and keeps DTP running where
  it is not needed.

remediation:
  recommended_change:
    - "{block}"
    - " switchport nonegotiate"
  before_you_apply:
    - "Find the neighbour: `show cdp neighbors {interface} detail`."
    - "The other end must be a static trunk (`switchport mode trunk`)."
    - >-
      If it is `dynamic auto` or `desirable`, the trunk goes down. `show dtp
      interface {interface}` shows what is negotiated.

applies_to: trunk ports (switchport mode trunk)

references:
  stig:
    - id: V-220666
      stig_id: CISC-L2-000200
      benchmark: Cisco IOS XE Switch L2S V3R2
      severity: CAT II
      relation: satisfies
  nist_800_53: [CM-6]
  cisco_guide: null
  cisa: false

examples:
  compliant:
    - |
      interface Ethernet0/0
       switchport mode trunk
       switchport nonegotiate
  non_compliant:
    - |
      interface Ethernet0/0
       switchport trunk encapsulation dot1q
       switchport mode trunk
