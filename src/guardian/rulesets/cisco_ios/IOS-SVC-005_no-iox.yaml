id: IOS-SVC-005
title: IOx application hosting must be disabled when not used
severity: medium

scope: global

check:
  must_not_exist: "^iox$"

rationale: >
  IOx runs Linux containers (Guest Shell, apps) on the device. Each one is
  extra code with network access that has to be patched and watched. Turn it
  off unless an application really needs it.

remediation:
  recommended_change:
    - "no iox"
  before_you_apply:
    - >-
      No applications run: `show app-hosting list`, `show iox-service`
      (ThousandEyes, Cyber Vision, Guest Shell), and no EEM scripts use Guest
      Shell.
    - "If Guest Shell is enabled, stop it first in privileged EXEC mode: `guestshell disable`."

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Disable Unused Services"
  cisa: true

examples:
  compliant:
    - |
      no iox
    - |
      hostname R1
  non_compliant:
    - |
      iox
