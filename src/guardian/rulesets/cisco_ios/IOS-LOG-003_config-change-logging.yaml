id: IOS-LOG-003
title: Configuration changes must be logged
severity: medium

scope: global

check:
  # archive > log config > logging enable
  python: config-change-logging

rationale: >
  Without the configuration change logger nobody can say later who changed
  what and when. With "notify syslog" each change also goes to the syslog
  server.

remediation:
  recommended_change:
    - "archive"
    - " log config"
    - "  logging enable"
    - "  hidekeys"
    - "  notify syslog contenttype plaintext"
  before_you_apply:
    - "The syslog server can take the extra messages: every configuration command is logged."
  notes:
    - "Keep `hidekeys` together with `notify syslog`, otherwise typed passwords go to syslog."

references:
  stig:
    - id: V-215819
      stig_id: CISC-ND-000330
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT II
      relation: satisfies
    - id: V-215850
      stig_id: CISC-ND-001270
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT II
      relation: related
  nist_800_53: [AU-12, AU-3]
  cisco_guide: "Configuration Change Notification and Logging"
  cisa: false

examples:
  compliant:
    - |
      archive
       log config
        logging enable
        hidekeys
  non_compliant:
    - |
      archive
       path flash:backup
    - |
      archive
       log config
        hidekeys
    - |
      hostname R1
