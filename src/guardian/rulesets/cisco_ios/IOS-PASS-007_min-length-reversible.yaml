id: IOS-PASS-007
title: Minimum password length must be at least 8 (clear text passwords present)
severity: high

scope: global

check:
  # Same check as IOS-PASS-006, but fails only when the config also contains
  # a clear text or type 7 password (enable password, username ... password,
  # or "password" under a line).
  python: password-min-length-reversible

rationale: >
  A short password stored in clear text or as reversible type 7 is the worst
  combination: anyone with the config reads it directly, and anyone without
  it can guess it quickly. Fix the clear text passwords (IOS-PASS-001 to 003)
  and set a minimum length.

remediation: |
  security passwords min-length 12

examples:
  compliant:
    - |
      security passwords min-length 8
      enable password Cisco123
    - |
      hostname SW1
      enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      security passwords min-length 6
      enable password Cisco123
    - |
      username admin privilege 15 password 7 0822455D0A16
    - |
      line vty 0 4
       password Cisco123
       login
