id: IOS-IF-001
title: Packets with IP options must be dropped
severity: low

scope: global

check:
  # N/A on multicast routers ("ip multicast-routing", "ip pim") and where RSVP
  # runs ("mpls traffic-eng tunnels", "ip rsvp"): dropping options breaks them.
  python: ip-options-drop

rationale: >
  Packets with IP options are processed by the CPU instead of in hardware,
  so a stream of them can overload the device. They are almost never needed
  (source routing, record route). Exception: "ip options drop" also drops
  packets with the Router Alert option that IGMP, PIM and RSVP rely on, so
  the rule does not apply to devices that route multicast or run RSVP
  (MPLS traffic engineering).

remediation:
  recommended_change:
    - "ip options drop"
  before_you_apply:
    - "No multicast routing: `show ip mroute` is empty."
    - >-
      No RSVP or MPLS TE: `show ip rsvp interface`, `show mpls traffic-eng
      tunnels`. Dropping options breaks them (Router Alert).
  if_service_needed:
    text: >-
      Use `ip options ignore` (packets are forwarded as if they had no options),
      or filter options on the internet edge ACL instead.
    commands:
      - "ip options ignore"

references:
  stig: []
  nist_800_53: []
  cisco_guide: "IP Options Selective Drop"
  cisa: false

examples:
  compliant:
    - |
      ip options drop
  not_applicable:
    - |
      ip multicast-routing
    - |
      interface GigabitEthernet0/1
       ip address 10.0.10.1 255.255.255.0
       ip pim sparse-mode
  non_compliant:
    - |
      hostname R1
