id: IOS-MGMT-013
title: SSH must allow at most 3 authentication retries per connection
severity: low

scope: global

check:
  value:
    pattern: "^ip ssh authentication-retries (\\d+)"
    max: 3
    # IOS default is 3, so a missing line is compliant.
    if_missing: pass

rationale: >
  More retries per connection let a password guesser try more passwords
  before it has to reconnect.

remediation:
  recommended_change:
    - "ip ssh authentication-retries 3"
  before_you_apply:
    - "Tools that log in over SSH have the right credentials and do not need extra retries."

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Encrypt Management Sessions"
  cisa: false

examples:
  compliant:
    - |
      ip ssh authentication-retries 2
    - |
      ip ssh version 2
  non_compliant:
    - |
      ip ssh authentication-retries 5
