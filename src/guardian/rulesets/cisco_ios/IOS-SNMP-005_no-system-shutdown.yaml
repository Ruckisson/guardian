id: IOS-SNMP-005
title: SNMP must not be allowed to reload the device
severity: high

scope: global

check:
  must_not_exist: "^snmp-server system-shutdown$"

rationale: >
  With "snmp-server system-shutdown" a single SNMP write request can reload
  the device. Combined with a leaked or guessed RW community this is a
  remote off switch.

remediation:
  recommended_change:
    - "no snmp-server system-shutdown"
  before_you_apply:
    - "No tool reloads the device over SNMP on purpose."

references:
  stig: []
  nist_800_53: []
  cisco_guide: null
  cisa: false

examples:
  compliant:
    - |
      snmp-server community Xq7-lab-monitoring RO 10
  non_compliant:
    - |
      snmp-server system-shutdown
