id: IOS-PASS-008
title: Enable secret must be configured
severity: high

scope: global

check:
  must_exist: "^enable secret "

rationale: >
  Without an enable secret the privileged EXEC mode is protected only by a
  reversible enable password, or on the console by nothing at all.

remediation:
  recommended_change:
    - "enable algorithm-type scrypt secret <NEW_PASSWORD>"
  before_you_apply:
    - >-
      Check the IOS supports scrypt: `enable algorithm-type ?`. If it does not,
      use `enable secret <NEW_PASSWORD>` (and `username ... secret`).
  notes:
    - >-
      Replace <NEW_PASSWORD> before you paste: IOS would accept the placeholder
      itself as the password.

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Password Management"
  cisa: false

examples:
  compliant:
    - |
      enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      enable password Cisco123
    - |
      hostname SW1
