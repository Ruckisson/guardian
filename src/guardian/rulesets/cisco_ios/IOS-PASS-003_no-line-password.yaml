id: IOS-PASS-003
title: Console, AUX and VTY lines must not use a line password
severity: high

scope:
  path: "^line (con|vty|aux) "

check:
  must_not_exist: "^password "

rationale: >
  A line password is stored in clear text or as reversible type 7, and it
  is one shared password with no user name, so logins cannot be traced to a
  person. Use local users with secret (or AAA) and "login local" instead.

remediation:
  recommended_change:
    - when_config: "^aaa new-model$"
      commands:
        - "{block}"
        - " login authentication default"
        - " no password"
    - commands:
        - "{block}"
        - " login local"
        - " no password"
  before_you_apply:
    - >-
      A local user with `secret` and privilege 15 exists (`show running-config |
      include ^username`). If not, create it first: `username <ADMIN_USER>
      privilege 15 algorithm-type scrypt secret <NEW_PASSWORD>`. Entering an
      existing name replaces that user's secret.
    - >-
      With AAA the line needs a defined method list (`aaa authentication login
      default local` or the list you use).
    - "Keep a second session (or the console) open while you test."
  notes:
    - >-
      Change the credential to a new value, do not reuse the old one: it was
      readable in the config.
    - "The change is chosen by whether the config has `aaa new-model`."
  may_cut_access: true

applies_to: console, AUX or VTY lines

references:
  stig:
    - id: V-215832
      stig_id: CISC-ND-000620
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [IA-5(1)]
  cisco_guide: "Password Management"
  cisa: false

examples:
  compliant:
    - |
      line con 0
       login local
    - |
      line vty 0 4
       login local
       transport input ssh
    - |
      line aux 0
       no exec
       transport input none
  non_compliant:
    - |
      line con 0
       password Cisco123
    - |
      line aux 0
       password 7 $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
    - |
      line vty 0 4
       password 5 $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
