id: IOS-PASS-003
title: Console, AUX and VTY lines must not use a line password
severity: high

scope:
  path: "^line (con|vty|aux) "

check:
  must_not_exist: "^password "

rationale: >
  Non-encrypted / easily crackable password for console, vty and aux must never be used.

remediation: |
  username <name> privilege 15 secret <password>
  line con 0
   no password
   login local

examples:
  compliant:
    - |
      line con 0
       no password
       login local
       transport input ssh
    - |
      line vty 0 4
       no password
       login local
       transport input ssh
    - |
      line aux 0
       no password
       login local
       transport input ssh
  non_compliant:
    - |
      line con 0
       password Cisco123
    - |
      line aux 0
       password 7 $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
    - |
      line vty 0 4
       password 5 $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
