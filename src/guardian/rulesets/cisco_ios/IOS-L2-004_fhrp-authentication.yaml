id: IOS-L2-004
title: HSRP and VRRP groups must use MD5 authentication
severity: medium

scope:
  path: "^interface "
  has_child: "^(standby( \\d+)? ip|vrrp \\d+ ip)( |$)"

check:
  # Every group on the interface, not just one of them.
  python: fhrp-authentication

rationale: >
  Without authentication any host on the segment can send HSRP or VRRP
  hellos with a higher priority, become the default gateway and see all
  traffic. Plain text authentication is visible in every hello.
  VRRPv3 (address-family blocks) has no authentication and is not checked.

remediation:
  recommended_change:
    # One line per group that fails, with its own protocol; groups that
    # already use MD5 are not touched, so their key chain stays.
    - "key chain <KEY_CHAIN>"
    - " key 1"
    - "  key-string <FHRP_KEY>"
    - "{block}"
    - " {fhrp_group} authentication md5 key-chain <KEY_CHAIN>"
  before_you_apply:
    - "Find all routers in the group: `show standby brief` or `show vrrp brief`."
    - >-
      Configure the same key chain on all of them in one maintenance window.
      Until all members match, more than one router may become active.
    - "Use a new random key; <FHRP_KEY> is never taken from the config."
  notes:
    - >-
      Only groups without MD5 are listed; HSRP group 0 has no number
      (`standby authentication md5 ...`).
    - >-
      VRRPv3 (`vrrp <GROUP> address-family ...`) has no authentication; the rule
      does not check it.
  change_both_ends: true

applies_to: interfaces with HSRP or VRRP groups

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Secure First Hop Redundancy Protocols"
  cisa: false

examples:
  compliant:
    - |
      interface Vlan10
       ip address 10.0.10.2 255.255.255.0
       standby 1 ip 10.0.10.1
       standby 1 authentication md5 key-chain FHRP
    - |
      interface Vlan20
       vrrp 2 ip 10.0.20.1
       vrrp 2 authentication md5 key-chain FHRP
    - |
      interface Vlan30
       standby ip 10.0.30.1
       standby authentication md5 key-chain FHRP
    - |
      interface Vlan40
       standby 1 ip
       standby 1 authentication md5 key-chain FHRP
       vrrp 2 ip 10.0.40.1
       vrrp 2 authentication md5 key-chain FHRP
  non_compliant:
    - |
      interface Vlan10
       standby 1 ip 10.0.10.1
    - |
      interface Vlan10
       standby 1 ip 10.0.10.1
       standby 1 authentication cisco
    - |
      interface Vlan10
       standby 1 ip 10.0.10.1
       standby 1 authentication md5 key-chain FHRP
       standby 2 ip 10.0.10.254
    - |
      interface Vlan40
       standby 1 ip
