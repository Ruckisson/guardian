id: IOS-LOG-001
title: Log messages must carry date and time stamps
severity: medium

scope: global

check:
  must_exist: "^service timestamps log datetime( |$)"

rationale: >
  Without date and time stamps, log messages from several devices cannot be
  put in order, which makes troubleshooting and incident investigation
  much harder. Uptime-based stamps are not enough after a reload.

remediation:
  recommended_change:
    - "service timestamps log datetime msec localtime show-timezone"
    - "service timestamps debug datetime msec localtime show-timezone"
  before_you_apply:
    - >-
      `show clock` shows the right time zone. Without `clock timezone` the
      stamps are in UTC, which is fine but should be known.

references:
  stig:
    - id: V-215817
      stig_id: CISC-ND-000280
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT II
      relation: satisfies
  nist_800_53: [AU-3]
  cisco_guide: "Configure Logging Timestamps"
  cisa: false

examples:
  compliant:
    - |
      service timestamps log datetime msec
    - |
      service timestamps log datetime msec localtime show-timezone
  non_compliant:
    - |
      service timestamps log uptime
    - |
      no service timestamps log
    - |
      hostname SW1
