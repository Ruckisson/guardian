id: IOS-MGMT-012
title: SSH negotiation timeout must be 60 seconds or less
severity: low

scope: global

check:
  value:
    pattern: "^ip ssh time-out (\\d+)"   # seconds
    max: 60
    # IOS default is 120 seconds, so a missing line is not compliant.
    if_missing: fail

rationale: >
  The timeout limits how long an unauthenticated SSH connection may wait at
  the login stage. A short timeout frees VTY lines held by slow or idle
  connection attempts sooner.

remediation:
  recommended_change:
    - "ip ssh time-out 60"
  before_you_apply:
    - "Nobody logs in over a link so slow that authentication takes more than a minute."

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Encrypt Management Sessions"
  cisa: false

examples:
  compliant:
    - |
      ip ssh time-out 60
    - |
      ip ssh time-out 30
  non_compliant:
    - |
      ip ssh time-out 120
    - |
      ip ssh version 2
