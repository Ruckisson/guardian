id: IOS-SNMP-001
title: SNMP must not use the default communities public or private
severity: critical

scope: global

check:
  must_not_exist: "^snmp-server community (?i:public|private)( |$)"

rationale: >
  "public" and "private" are the first community strings every scanner
  tries. With them anyone who can reach the device over SNMP can read its
  configuration details, and with write access change them.

remediation:
  recommended_change:
    - when_line: "^snmp-server community public( |$)"
      commands:
        - "no snmp-server community public"
    - when_line: "^snmp-server community private( |$)"
      commands:
        - "no snmp-server community private"
    - commands:
        - "no snmp-server community <COMMUNITY>"
  before_you_apply:
    - >-
      Find out which community the monitoring system uses and move it to a new
      random community or to SNMPv3 first (IOS-SNMP-003, IOS-SNMP-004).
    - "`show snmp` shows whether the device gets SNMP requests at all."
  notes:
    - >-
      <COMMUNITY> is the existing community in the spelling of the config
      (hidden in this report).
    - >-
      Change the credential to a new value, do not reuse the old one: it was
      readable in the config.

references:
  stig: []
  nist_800_53: []
  cisco_guide: "SNMP Community Strings"
  cisa: false

examples:
  compliant:
    - |
      snmp-server community Xq7-lab-monitoring RO 10
    - |
      snmp-server group ADMINS v3 priv
    - |
      hostname SW1
  non_compliant:
    - |
      snmp-server community public RO
    - |
      snmp-server community private RW
    - |
      snmp-server community Public RO 10
