id: IOS-NTP-003
title: NTP servers and peers must be authenticated
severity: medium

scope: global

check:
  # Every "ntp server/peer" needs "key <n>" where n is defined and trusted.
  # Passes when no NTP server is configured (IOS-NTP-001 reports that).
  python: ntp-authentication

rationale: >
  Without authentication anyone who can send packets to the device can act as
  its time server. A wrong clock breaks log correlation, certificates and
  time based ACLs, and can hide when an attack happened.

remediation: |
  ntp authentication-key 1 hmac-sha2-256 <key>
  ntp trusted-key 1
  ntp authenticate
  ntp server <ntp-ip> key 1

examples:
  compliant:
    - |
      ntp authentication-key 1 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 1
      ntp server 172.16.1.1 key 1
    - |
      ntp authentication-key 1 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 1
      ntp server vrf MGMT 172.16.1.1 key 1 prefer
    - |
      hostname R1
    - |
      ntp authentication-key 2 md5 104D000A0618 7
      ntp authentication-key 3 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 1 - 3
      ntp server 172.16.1.1 key 2
      ntp peer 172.16.1.2 key 3
  non_compliant:
    - |
      ntp server 172.16.1.1
    - |
      ntp authenticate
      ntp trusted-key 1
      ntp server 172.16.1.1 key 1
    - |
      ntp authentication-key 1 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 1
      ntp server 172.16.1.1 key 1
      ntp server 172.16.1.2
    - |
      ntp authentication-key 1 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 2
      ntp server 172.16.1.1 key 1
    - |
      ntp authentication-key 1 md5 104D000A0618 7
      ntp authenticate
      ntp trusted-key 1
      ntp server 172.16.1.1 key 3
