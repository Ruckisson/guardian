id: IOS-PASS-004
title: Password encryption service must be enabled
severity: low

scope: global

check:
  must_exist: "^service password-encryption$"

rationale: >
  Without this service, line passwords, "username ... password" and similar
  secrets are shown in clear text in the configuration. Type 7 encryption is
  weak and only protects against someone reading over your shoulder, so it
  does not replace "secret", but it stops clear text passwords from ending up
  in backups, tickets and screenshots.

remediation: |
  service password-encryption

examples:
  compliant:
    - |
      service password-encryption
  non_compliant:
    - |
      no service password-encryption
    - |
      hostname SW1
