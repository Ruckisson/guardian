id: IOS-PASS-004
title: Password encryption service must be enabled
severity: low

scope: global

check:
  must_exist: "^service password-encryption$"

rationale: >
  Without this service, line passwords, "username ... password" and similar
  secrets are shown in clear text in the configuration. Type 7 encryption is
  weak and only protects against someone reading over your shoulder, so it
  does not replace "secret", but it stops clear text passwords from ending up
  in backups, tickets and screenshots.

remediation:
  recommended_change:
    - "service password-encryption"
  before_you_apply:
    - "Nothing to check on the device; the command only changes how passwords are shown."
  notes:
    - >-
      Type 7 is only obfuscation and can be reversed in a second. It protects
      against a look over the shoulder and does not replace `secret`.

references:
  stig:
    - id: V-215832
      stig_id: CISC-ND-000620
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [IA-5(1)]
  cisco_guide: "Password Management"
  cisa: false

examples:
  compliant:
    - |
      service password-encryption
  non_compliant:
    - |
      no service password-encryption
    - |
      hostname SW1
