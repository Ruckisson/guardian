id: IOS-MGMT-010
title: Console and VTY lines must require login
severity: critical

scope:
  path: "^line (con|vty) "
  skip_if:
    # A VTY line with "transport input none" accepts no connections.
    - block: "^line vty "
      child: "^transport input none$"
      reason: the line accepts no connections (transport input none)

check:
  # Without AAA: "login" or "login local". With "aaa new-model": the line's
  # "login authentication <list>", else the default list; the list must be
  # defined and must not contain "none". Without any default list VTY lines
  # use local users, the console has no login at all.
  python: line-requires-login

rationale: >
  Without a login requirement the console gives a prompt to anyone who plugs
  in a cable. With "aaa new-model" the line "login" commands no longer
  apply, so a login method list must cover the line. A method list with
  "none" lets anyone in, either always or whenever the TACACS+/RADIUS
  server is unreachable.

remediation:
  recommended_change:
    - when_config: "^aaa new-model$"
      commands:
        - "{block}"
        - " login authentication default"
    - commands:
        - "{block}"
        - " login local"
  before_you_apply:
    - >-
      A local user with `secret` and privilege 15 exists (`show running-config |
      include ^username`). If not, create it first: `username <ADMIN_USER>
      privilege 15 algorithm-type scrypt secret <NEW_PASSWORD>`. Entering an
      existing name replaces that user's secret.
    - >-
      With AAA the line needs a defined method list (`aaa authentication login
      default local` or the list you use).
    - >-
      Test a new login before you close your session. Change the console while
      you are on SSH, not the other way round.
  notes:
    - "The change is chosen by whether the config has `aaa new-model`."
  may_cut_access: true

applies_to: console or VTY lines

references:
  stig: []
  nist_800_53: []
  cisco_guide: "Control vty and tty Lines"
  cisa: false

examples:
  compliant:
    - |
      line vty 0 4
       login local
    - |
      aaa new-model
      aaa authentication login default local
      line con 0
       logging synchronous
    - |
      aaa new-model
      aaa authentication login CONSOLE local
      line con 0
       login authentication CONSOLE
    - |
      aaa new-model
      username admin privilege 15 secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
      line vty 0 4
       transport input ssh
  non_compliant:
    - |
      line con 0
       logging synchronous
    - |
      aaa new-model
      line vty 0 4
       login local
    - |
      aaa new-model
      aaa authentication login default none
      line con 0
    - |
      aaa new-model
      aaa authentication login default group tacacs+ none
      line vty 0 4
    - |
      aaa new-model
      aaa authentication login default local
      line vty 0 4
       login authentication UNDEFINED
