id: IOS-MGMT-004
title: Console and VTY sessions must not have timeouts disabled
severity: high

scope:
  path: "^line (con|vty) "
  skip_if:
    # A VTY line with "transport input none" accepts no connections.
    - block: "^line vty "
      child: "^transport input none$"
      reason: the line accepts no connections (transport input none)

check:
  # "exec-timeout 0 0" (or "0") means the session never times out.
  must_not_exist: "^exec-timeout 0( 0)?$"

rationale: >
  A session that never times out stays logged in when an administrator
  walks away or loses the connection, and anyone who reaches that terminal
  inherits the privileges.

remediation:
  recommended_change:
    - "{block}"
    - " exec-timeout 5 0"
  before_you_apply:
    - >-
      Nobody relies on a session that never times out, for example a console
      that shows debug output for hours.

applies_to: console or VTY lines

references:
  stig:
    - id: V-215833
      stig_id: CISC-ND-000720
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [SC-10]
  cisco_guide: "EXEC Timeout"
  cisa: false

examples:
  compliant:
    - |
      line con 0
       exec-timeout 5 0
    - |
      line vty 0 4
       exec-timeout 0 30
    - |
      line vty 0 4
       transport input ssh
  non_compliant:
    - |
      line con 0
       exec-timeout 0 0
    - |
      line vty 5 15
       exec-timeout 0
