id: IOS-IF-002
title: Proxy ARP must be disabled on routed interfaces
severity: medium

scope:
  path: "^interface (?!Loopback|Null|Tunnel)"
  has_child: "^ip address (\\d|dhcp)"
  not_has_child: "^shutdown$"

check:
  must_exist: "^no ip proxy-arp$"

rationale: >
  With proxy ARP the router answers ARP requests for addresses in other
  networks. It hides bad host netmasks and lets a host on one segment reach
  places it should not, and a spoofed answer can redirect traffic.

remediation:
  recommended_change:
    - "{block}"
    - " no ip proxy-arp"
  before_you_apply:
    - >-
      Hosts on this subnet have a correct mask and default gateway; proxy ARP
      may be hiding wrong settings.
    - >-
      Neighbouring devices do not use static routes pointing out an interface
      without a next hop toward this router.
    - "Apply in a maintenance window and watch `show ip arp {interface}` afterwards."

applies_to: routed interfaces that are up (with an IP address, not shut down)

references:
  stig:
    - id: V-216676
      stig_id: CISC-RT-000380
      benchmark: Cisco IOS XE Router RTR V3R5
      severity: CAT II
      relation: satisfies
  nist_800_53: [SC-7]
  cisco_guide: "Proxy ARP"
  cisa: false

examples:
  compliant:
    - |
      interface Vlan99
       ip address 172.16.1.2 255.255.255.0
       no ip proxy-arp
  not_applicable:
    - |
      interface Loopback0
       ip address 10.255.0.1 255.255.255.255
    - |
      interface GigabitEthernet0/2
       ip address 10.0.2.1 255.255.255.0
       shutdown
  non_compliant:
    - |
      interface GigabitEthernet0/0
       description WAN
       ip address dhcp
    - |
      interface GigabitEthernet0/0
       ip address 10.0.0.1 255.255.255.0
