id: IOS-PASS-002
title: Local users must use secret, not password
severity: high

scope: global

check:
  must_not_exist: "^username \\S+ (.* )?password "

rationale: >
  Non-encrypted password for users should never be used. "username ... password"
  is stored in clear text or as reversible type 7, while "username ... secret"
  is stored as a one-way hash.

remediation:
  recommended_change:
    - "no username {username}"
    - "username {username} privilege <PRIVILEGE> algorithm-type scrypt secret <NEW_PASSWORD>"
  before_you_apply:
    - >-
      IOS does not let a user have both password and secret, so the user is
      removed and created again. Another privilege 15 account or the console
      works, and you are not logged in as {username}.
    - "Use the lowest privilege the user needs, not automatically the old one."
    - "Re-add any other options of the original line (autocommand, view)."
    - >-
      Check the IOS supports scrypt: `enable algorithm-type ?`. If it does not,
      use `enable secret <NEW_PASSWORD>` (and `username ... secret`).
  notes:
    - >-
      Change the credential to a new value, do not reuse the old one: it was
      readable in the config.
    - >-
      Replace <NEW_PASSWORD> before you paste: IOS would accept the placeholder
      itself as the password.
    - >-
      Enter `no username {username}` on its own and confirm the prompt, then
      enter the second line.
  may_cut_access: true

references:
  stig:
    - id: V-215832
      stig_id: CISC-ND-000620
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [IA-5(1)]
  cisco_guide: "Password Management"
  cisa: false

examples:
  compliant:
    - |
      username admin secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
    - |
      username user1 privilege 15 secret 9 $9$aB3dEfGhIjKlMn$ZyXwVuTsRqPoNmLkJiHgFeDcBa9876543210abcdefg
    - |
      username user2 privilege 1 secret 8 $8$dsYGNam3K1SIJO$7nv/35M/qr6t.dVc7UY9zrJDWRVqncHub1PE9UlMQFs
    - |
      hostname SW1
  non_compliant:
    - |
      username admin password Cisco123
    - |
      username user1 password 7 0822455D0A16
    - |
      username user2 privilege 15 password 0 Cisco123
    - |
      username user3 privilege 1 password 7 0822455D0A16
