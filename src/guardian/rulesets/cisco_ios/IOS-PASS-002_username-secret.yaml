id: IOS-PASS-002
title: enable password exists
severity: high

scope: global

check:
  must_not_exist: "^username \\S+ (.* )?password "

rationale: >
  Non-encrypted password for users should never be used. 

remediation: |
  no <username> password <password>}
  <username> secret <password>

examples:
  compliant:
    - |
      admin secret $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
    - |
      user1 secret 5 $1$labasdwq3x1lYQ0gGd3Hc9mXc6b
    - |
      user2 secret 8 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      user3 secret 9 $67ab0$aqwed3Hc9mXc6b
  non_compliant:
    - |
      admin password Cisco123
    - |
      user1 password 7 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      user2 password 5 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      user3 password 8 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      admin password 9 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
