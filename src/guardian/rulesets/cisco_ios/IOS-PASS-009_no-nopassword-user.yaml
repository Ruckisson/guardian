id: IOS-PASS-009
title: Local users must not be configured without a password
severity: high

scope: global

check:
  must_not_exist: "^username \\S+ (.* )?nopassword( |$)"

rationale: >
  "username <name> nopassword" creates an account that logs in with the user
  name alone. Anyone who knows or guesses the name gets in.

remediation: |
  no username <name>
  username <name> privilege <level> algorithm-type scrypt secret <password>

examples:
  compliant:
    - |
      username admin privilege 15 secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      username guest nopassword
    - |
      username tech privilege 15 nopassword
