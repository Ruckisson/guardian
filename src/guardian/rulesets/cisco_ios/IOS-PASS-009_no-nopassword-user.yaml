id: IOS-PASS-009
title: Local users must not be configured without a password
severity: high

scope: global

check:
  must_not_exist: "^username \\S+ (.* )?nopassword( |$)"

rationale: >
  "username <name> nopassword" creates an account that logs in with the user
  name alone. Anyone who knows or guesses the name gets in.

remediation:
  recommended_change:
    - "username {username} privilege <PRIVILEGE> algorithm-type scrypt secret <NEW_PASSWORD>"
  before_you_apply:
    - >-
      Check whether the user logs in with an SSH key (`show running-config |
      section pubkey-chain`) or is used by automation. A secret on a key-only
      user adds a password fallback.
    - "Use the lowest privilege the user needs."
    - "Check the logs for logins of {username}: the account may have been misused."
  notes:
    - >-
      If nobody uses the account, remove it instead: enter `no username
      {username}` on its own and confirm the prompt.
    - >-
      Replace <NEW_PASSWORD> before you paste: IOS would accept the placeholder
      itself as the password.

references:
  stig: []
  nist_800_53: []
  cisco_guide: null
  cisa: false

examples:
  compliant:
    - |
      username admin privilege 15 secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      username guest nopassword
    - |
      username tech privilege 15 nopassword
