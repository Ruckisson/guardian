id: IOS-PASS-005
title: Enable and user secrets must not use weak hash types 4 or 5
severity: medium

scope: global

check:
  must_not_exist: "^(enable |username \\S+ (.* )?)secret [45] "

rationale: >
  Type 5 is a salted MD5 hash, fast enough to crack with a GPU and a
  wordlist. Type 4 is a broken SHA-256 implementation without salt and many
  iterations, and is deprecated by Cisco. Type 8 (PBKDF2) or type 9 (scrypt)
  are much slower to crack.

remediation:
  recommended_change:
    - when_line: "^enable "
      commands:
        - "enable algorithm-type scrypt secret <NEW_PASSWORD>"
    - commands:
        - "username {username} privilege <PRIVILEGE> algorithm-type scrypt secret <NEW_PASSWORD>"
  before_you_apply:
    - >-
      Check the IOS supports scrypt: `enable algorithm-type ?`. If it does not,
      use `enable secret <NEW_PASSWORD>` (and `username ... secret`).
    - >-
      Tell the account owners their password is being reset. Use the lowest
      privilege the user needs.
    - >-
      Images older than IOS 15.3(3)M / IOS-XE 3.10 reject type 9 at boot; do not
      downgrade after the change.
  notes:
    - "A secret replaces a secret without `no username`."
    - >-
      Set a new password: the old hash may already be cracked. Type 8 (PBKDF2)
      is acceptable too.
    - >-
      Replace <NEW_PASSWORD> before you paste: IOS would accept the placeholder
      itself as the password.

references:
  stig:
    - id: V-215832
      stig_id: CISC-ND-000620
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [IA-5(1)]
  cisco_guide: "Enhanced Password Security"
  cisa: true

examples:
  compliant:
    - |
      enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
    - |
      enable secret 8 $8$dsYGNam3K1SIJO$7nv/35M/qr6t.dVc7UY9zrJDWRVqncHub1PE9UlMQFs
    - |
      username admin privilege 15 secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      enable secret 5 $1$lab0$Zq3x1lYQ0gGd3Hc9mXc6b/
    - |
      enable secret 4 tnhtc92DXBhelxjYk8LWJrPV36S2i4ntXrpb4RFmfqY
    - |
      username admin secret 5 $1$lab1$P8tYw2qQ1sVb7Nd4kLr9e.
    - |
      username admin privilege 15 secret 5 $1$lab1$P8tYw2qQ1sVb7Nd4kLr9e.
