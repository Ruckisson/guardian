id: IOS-MGMT-007
title: SSH must be limited to version 2
severity: medium

scope: global

check:
  must_exist: "^ip ssh version 2$"

rationale: >
  SSH version 1 has known design flaws (session hijacking, weak integrity
  checks). Without "ip ssh version 2" older IOS runs in compatibility mode
  1.99 and still accepts version 1 clients.

remediation:
  recommended_change:
    - "ip ssh version 2"
  before_you_apply:
    - >-
      An RSA key of at least 768 bits exists, 2048 recommended: `show crypto key
      mypubkey rsa`.

references:
  stig:
    - id: V-215844
      stig_id: CISC-ND-001200
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
    - id: V-215845
      stig_id: CISC-ND-001210
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [MA-4]
  cisco_guide: "SSHv2"
  cisa: false

examples:
  compliant:
    - |
      ip ssh version 2
  non_compliant:
    - |
      ip ssh version 1
    - |
      hostname SW1
