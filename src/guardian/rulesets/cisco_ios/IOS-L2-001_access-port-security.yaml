id: IOS-L2-001
title: Active access ports must have port security or 802.1X/MAB
severity: medium

scope:
  path: "^interface "
  has_child: "^switchport mode access$"
  not_has_child: "^shutdown$"

check:
  # 802.1X/MAB only protects the port when it is enforced ("port-control
  # auto"); "dot1x pae authenticator" or "mab" alone leave the port open.
  must_exist: "^(switchport port-security|(authentication|access-session) port-control auto)$"

rationale: >
  Port security limits how many MAC addresses a port accepts. It stops MAC
  flooding of the switch table and makes it harder to plug an unknown
  switch or device into an office port. 802.1X/MAB with enforced port
  control is accepted as an equivalent: an unknown device gets no access
  at all. Trunks, shut-down ports and ports
  without an explicit access mode are out of scope for this rule.

remediation: |
  interface <access-port>
   switchport port-security maximum 2
   switchport port-security violation restrict
   switchport port-security
  Or 802.1X/MAB:
  interface <access-port>
   authentication port-control auto
   mab
   dot1x pae authenticator

examples:
  compliant:
    - |
      interface Ethernet0/1
       switchport mode access
       switchport port-security maximum 2
       switchport port-security
    - |
      interface Ethernet0/2
       switchport mode access
       shutdown
    - |
      interface Ethernet0/0
       switchport trunk encapsulation dot1q
       switchport mode trunk
    - |
      interface Vlan99
       ip address 172.16.1.2 255.255.255.0
    - |
      interface GigabitEthernet1/0/5
       switchport mode access
       authentication port-control auto
       mab
       dot1x pae authenticator
    - |
      interface GigabitEthernet1/0/6
       switchport mode access
       access-session port-control auto
       dot1x pae authenticator
  non_compliant:
    - |
      interface Ethernet0/1
       switchport mode access
    - |
      interface Ethernet0/1
       switchport mode access
       switchport port-security maximum 2
    - |
      interface GigabitEthernet1/0/5
       switchport mode access
       dot1x pae authenticator
       mab
