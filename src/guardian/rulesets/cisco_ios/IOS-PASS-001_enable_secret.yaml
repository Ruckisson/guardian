id: IOS-PASS-001
title: enable password exists
severity: high

scope: global

check:
  must_not_exist: "^enable password "

rationale: >
  Enable password is stored in the configuration in a reversible format, which can be easily decrypted. Enable secret is stored in a one-way hash format, which cannot be decrypted. Use enable secret instead of enable password.
  Enable secret has a priority, but if both are configured, enable password remains in the config and anyone who gets the config -> gets the password. 

remediation: |
  no enable password
  enable secret <password>

examples:
  compliant:
    - |
      enable secret $1$lab0$Zq3x1lasdxGd3Hc9mXc6b
    - |
      enable secret 5 $1$labasdwq3x1lYQ0gGd3Hc9mXc6b
    - |
      enable secret 8 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      enable secret 9 $67ab0$aqwed3Hc9mXc6b
  non_compliant:
    - |
      enable password Cisco123
    - |
      enable password 7 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      enable password 5 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      enable password 8 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
    - |
      enable password 9 $1$lab0$Zq3asdasd0gGd3Hc9mXc6b
