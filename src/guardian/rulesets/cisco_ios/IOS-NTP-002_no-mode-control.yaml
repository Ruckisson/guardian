id: IOS-NTP-002
title: NTP control messages (mode 6) must be disabled
severity: low

scope: global

check:
  must_exist: "^no ntp allow mode control$"

rationale: >
  NTP mode 6 queries reveal details about the device and its time sources
  and have been abused for amplification attacks. Normal time sync does not
  need them.

remediation:
  recommended_change:
    - "no ntp allow mode control"
  before_you_apply:
    - "No monitoring tool queries this device with `ntpq` (mode 6)."
  if_service_needed:
    text: >-
      Older IOS without this command: restrict who can talk NTP to the device.
    commands:
      - "ntp access-group peer <NTP_SERVERS_ACL>"
      - "ntp access-group serve-only <NTP_CLIENTS_ACL>"

references:
  stig: []
  nist_800_53: []
  cisco_guide: "NTP Control Messages"
  cisa: false

examples:
  compliant:
    - |
      ntp server 172.16.1.1
      no ntp allow mode control
  non_compliant:
    - |
      ntp server 172.16.1.1
