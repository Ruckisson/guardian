id: IOS-PASS-001
title: Enable password must not be used, use enable secret
severity: high

scope: global

check:
  must_not_exist: "^enable password "

rationale: >
  Enable password is stored in the configuration in a reversible format
  (clear text or type 7), which can be easily decrypted. Enable secret is
  stored as a one-way hash, which cannot be decrypted. Use enable secret
  instead of enable password.
  Enable secret has priority, but if both are configured, enable password
  remains in the config, and anyone who gets the config gets the password.

remediation:
  recommended_change:
    - "enable algorithm-type scrypt secret <NEW_PASSWORD>"
    - "no enable password"
  before_you_apply:
    - >-
      Check the IOS supports scrypt: `enable algorithm-type ?`. If it does not,
      use `enable secret <NEW_PASSWORD>` (and `username ... secret`).
    - "Update the enable password in automation and NMS tools."
  notes:
    - >-
      Change the credential to a new value, do not reuse the old one: it was
      readable in the config.
    - >-
      Replace <NEW_PASSWORD> before you paste: IOS would accept the placeholder
      itself as the password.

references:
  stig:
    - id: V-215832
      stig_id: CISC-ND-000620
      benchmark: Cisco IOS XE Router NDM V3R7
      severity: CAT I
      relation: related
  nist_800_53: [IA-5(1)]
  cisco_guide: "Password Management"
  cisa: false

examples:
  compliant:
    - |
      enable secret 5 $1$lab0$Zq3x1lYQ0gGd3Hc9mXc6b/
    - |
      enable secret 8 $8$dsYGNam3K1SIJO$7nv/35M/qr6t.dVc7UY9zrJDWRVqncHub1PE9UlMQFs
    - |
      enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
  non_compliant:
    - |
      enable password Cisco123
    - |
      enable password 0 Cisco123
    - |
      enable password 7 0822455D0A16
    - |
      enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
      enable password 7 0822455D0A16
