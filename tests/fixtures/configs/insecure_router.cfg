!
! Fake lab router for the SVC, IF, AAA, MGMT, LOG and L2 (HSRP) rules.
! Passwords, SNMP and the VTY lines are set up correctly on purpose, so the
! findings come from services, interfaces and the other lines.
!
version 15.4
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-small-servers
service udp-small-servers
service config
!
hostname EDGE-R1
!
boot network ftp://backup:rtlab-ftp-pass@10.9.9.9/edge-r1-confg
security passwords min-length 12
enable secret 9 $9$rtLabSaltAbCd$Zq3asdQwErTyUiOpAsDfGhJkLzXcVbNm1234567890a
!
username netadmin privilege 15 secret 9 $9$rtLabSaltEfGh$P8tYw2qQ1sVb7Nd4kLr9eAsDfGhJkLzXcVbNm123456
username guest nopassword
aaa new-model
aaa authorization exec default local
aaa local authentication attempts max-fail 3
!
ip finger
ip rcmd rcp-enable
ip rcmd rsh-enable
ip options drop
ip ssh version 2
login block-for 120 attempts 3 within 60
!
key chain FHRP
 key 1
  key-string 7 rtlab-fhrp-key
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
 no ip redirects
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.10.2 255.255.255.0
 ipv6 address 2001:db8:10::2/64
 no ip redirects
 no ip proxy-arp
 standby 1 ip 10.0.10.1
 standby 1 priority 110
!
interface GigabitEthernet0/2
 description LAN2
 ip address 10.0.20.2 255.255.255.0
 no ip proxy-arp
 standby 2 ip 10.0.20.1
 standby 2 authentication md5 key-chain FHRP
 standby 3 ip 10.0.20.3
!
interface GigabitEthernet0/3
 ip address 10.0.30.1 255.255.255.0
 shutdown
!
ip http secure-server
ip http authentication local
no ip http server
!
ip access-list standard MGMT-ACCESS
 permit 10.0.10.0 0.0.0.255
 deny   any log
!
logging host 10.0.10.50
snmp-server group ADMINS v3 priv access MGMT-ACCESS
snmp-server system-shutdown
!
archive
 log config
  logging enable
!
iox
!
line con 0
 exec-timeout 5 0
line aux 0
 exec-timeout 5 0
line tty 2 3
 transport input telnet
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 5 0
 login authentication VTY
 transport input ssh
!
ntp server 10.0.10.1
no ntp allow mode control
end
