!
! Fake hardened L3 access switch with the cases that used to cause false
! positives. Every rule must pass: 802.1X/MAB instead of port security,
! multicast routing without "ip options drop", routed "no switchport" port,
! SVI and loopback, VRF syslog and NTP, numbered SNMP ACL, no AUX line,
! no HTTPS server, HSRP group 0 written without a number, IPv6 with an
! IPv6 VTY ACL, NTP trusted key range.
!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service tcp-keepalives-in
service tcp-keepalives-out
service password-encryption
!
hostname ACC-SW1
!
security passwords min-length 15
enable secret 9 $9$edgeSaltAbCdEf$Zq3asdQwErTyUiOpAsDfGhJkLzXcVbNm1234567890a
!
username netadmin privilege 15 secret 9 $9$edgeSaltGhIjKl$P8tYw2qQ1sVb7Nd4kLr9eAsDfGhJkLzXcVbNm123456
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa local authentication attempts max-fail 3
!
ip multicast-routing
no ip source-route
no cdp run
no vstack
ip dhcp snooping vlan 10,20
ip dhcp snooping
ip ssh version 2
ip ssh time-out 60
login block-for 900 attempts 3 within 120
login quiet-mode access-class MGMT-ACCESS
login on-failure log
login on-success log
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
interface Loopback0
 ip address 10.255.0.11 255.255.255.255
!
interface GigabitEthernet1/0/1
 description USER-8021X
 switchport access vlan 10
 switchport mode access
 authentication port-control auto
 mab
 dot1x pae authenticator
 spanning-tree portfast
!
interface GigabitEthernet1/0/2
 description USER-IBNS2
 switchport access vlan 20
 switchport mode access
 access-session port-control auto
 dot1x pae authenticator
 spanning-tree portfast
!
interface GigabitEthernet1/0/23
 description UPLINK-TRUNK
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust
!
interface GigabitEthernet1/0/24
 description ROUTED-UPLINK
 no switchport
 ip address 10.0.0.2 255.255.255.252
 no ip redirects
 no ip proxy-arp
 ip pim sparse-mode
!
interface Vlan10
 ip address 10.0.10.1 255.255.255.0
 ipv6 address 2001:db8:10::1/64
 standby ip 10.0.10.254
 standby authentication md5 key-chain FHRP
 no ip redirects
 no ip proxy-arp
 ip pim sparse-mode
!
no ip http server
no ip http secure-server
!
ip access-list standard MGMT-ACCESS
 permit 10.0.99.0 0.0.0.255
 deny   any log
access-list 10 permit 10.0.99.50
ipv6 access-list MGMT-ACCESS-V6
 permit ipv6 2001:db8:99::/64 any
!
logging host 10.0.99.50 vrf MGMT
logging 10.0.99.51
snmp-server community Xq7-edge-monitoring RO 10
!
archive
 log config
  logging enable
  hidekeys
!
banner login ^C
Authorized access only. All activity is logged.
^C
!
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class MGMT-ACCESS in
 ipv6 access-class MGMT-ACCESS-V6 in
 exec-timeout 5 0
 transport input ssh
line vty 5 15
 access-class MGMT-ACCESS in
 ipv6 access-class MGMT-ACCESS-V6 in
 exec-timeout 5 0
 transport input ssh
!
ntp authentication-key 1 md5 104D000A0618 7
ntp authentication-key 2 md5 0822455D0A16 7
ntp authenticate
ntp trusted-key 1 - 2
ntp server vrf MGMT 10.0.99.1 key 1
ntp server vrf MGMT 10.0.99.2 key 2
ntp peer vrf MGMT 10.0.99.3 key 1
no ntp allow mode control
end
