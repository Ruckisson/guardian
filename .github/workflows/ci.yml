name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Installed package works outside the repository
        # A real (non-editable) install must ship the rules, CSS and HTML
        # templates. Exit code 1 only means the fixture has findings.
        run: |
          python -m venv /tmp/guardian-venv
          /tmp/guardian-venv/bin/pip install .
          cp tests/fixtures/configs/insecure_switch.cfg /tmp/insecure_switch.cfg
          cd /tmp
          set +e
          /tmp/guardian-venv/bin/guardian audit /tmp/insecure_switch.cfg -f html -o /tmp/r.html
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "<style" /tmp/r.html
